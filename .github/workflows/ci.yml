name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Run the reference benchmark
        run: python3 run_benchmark.py
