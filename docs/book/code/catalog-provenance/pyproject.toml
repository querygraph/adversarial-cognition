[project]
name = "catalog-provenance"
version = "0.1.0"
description = "CATALOG-PROVENANCE-v1: a provable-transaction benchmark for Iceberg REST catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "The QueryGraph project" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog_provenance"]
