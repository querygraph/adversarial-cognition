[package]
name = "capability-adversarial-biscuit-adapter"
version = "0.1.0"
edition = "2021"
description = "Biscuit capability-token adapter for CAPABILITY-ADVERSARIAL-v1"
license = "MIT OR Apache-2.0"

[[bin]]
name = "biscuit-adapter"
path = "src/main.rs"

[dependencies]
biscuit-auth = "5"
serde_json = "1"

[profile.release]
opt-level = 1
