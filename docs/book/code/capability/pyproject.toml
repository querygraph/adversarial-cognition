[project]
name = "capability-adversarial"
version = "0.1.0"
description = "CAPABILITY-ADVERSARIAL-v1: an adversarial benchmark for capability-gated authority"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "The QueryGraph project" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capability_adversarial"]
