[project]
name = "adversarial-cognition"
version = "0.1.0"
description = "MARCIANA-ADVERSARIAL-v1: a deterministic adversarial cognition benchmark for AI memory systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "The Marciana project" }]
keywords = ["benchmark", "ai-memory", "security", "adversarial"]

[project.urls]
Repository = "https://github.com/querygraph/adversarial-cognition"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adversarial_cognition"]
